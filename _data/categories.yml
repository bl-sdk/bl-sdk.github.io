# This file lists the categories we accept.
# The top level keys are what you add to your mod file. All keys are lowercase, and use dashes in
# place of spaces multiple words.
# Each value can then have a custom 'title', to fix spaces and/or capitalization, and a custom
# 'description', which is used in the category list.

# General Categories

cheat:
  title: Cheat
  description: >
    Mods that help you cheat.

dev:
  title: Developer Tools
  description: >
    Tools which are primarily useful for other mod developers.

dialog:
  title: Dialog / Audio
  description: >
    Dialog skippers, or other dialog tweaks, and more generally mods letting you mess with what
    audio plays.

enemy:
  title: Enemy
  description: >
    Changes to how enemies spawn and/or behave.

gameplay:
  title: Gameplay
  description: >
    Mods which significantly change how you play the game. Generally more focused than an overhaul,
    and are generally able to be switched on and off mid playthough.

gear:
  title: Gear
  description: >
    New gear, or tweaks to existing gear.

movement:
  title: Movement
  description: >
    New forms of movement, or mods that otherwise affect how you existing forms of movement behave.
    Does not include teleporting.

lib:
  title: Library
  description: >
    Libraries provide functionality for other mods. You generally only need to install these if
    another mod lists them as a requirement, they don't do much by themselves.

loot:
  title: Loot
  description: >
    Mods which affect the looting experience. New sources of loot, changes to what loot drops, and
    other tools which help dealing with loot.

overhaul:
  title: Overhaul
  description: >
    Major overhauls, which affect most of the game one way or another. Generally recommended to be
    played on a new save, and generally not compatible with other overhauls.

rando:
  title: Randomizer
  description: >
    Randomizes things, moreso than usual.

save-edit:
  title: Save Editing
  description: >
    In game tools which perform similar functions to a save editor - perhaps allowing you to edit
    parts, mess with your skills, or spawn in brand new items.

ui:
  title: UI / Visuals
  description: >
    Tweaks to the user interface, brand new UI elements, or mods that otherwise.mess with game's
    visuals.

utility:
  title: Utility
  description: >
    Useful small utilities. Generally, though not always, client side.

vehicle:
  title: Vehicle
  description: >
    Mods messing with vehicles, new ways of spawning them or tweaks to how they behave.

